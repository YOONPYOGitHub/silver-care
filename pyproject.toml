[project]
name = "silver-care"
version = "0.1.0"
description = "Korean silver-care assistant with Azure RAG and optional voice"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.13,<4",
  "azure-identity>=1.25,<2",
  "fastapi>=0.121,<1",
  "httpx>=0.28,<1",
  "pdfplumber>=0.11.10,<0.12",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["silvercare"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["silvercare"]
